server:
  port: 8085
spring:
  application:
    name: order-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:cloud}
  datasource:
    # 与库存分库：跨库才需要全局事务，单库一个本地事务就够了。
    url: ${MYSQL_TRADE_URL:jdbc:mysql://127.0.0.1:3307/order_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_TRADE_USER:smart_fridge_trade}
    password: ${MYSQL_TRADE_PASSWORD:smart_fridge_trade_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:8}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
    # 跨服务调用必须设超时：默认不超时会让下单线程被慢依赖一直拖住。
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:1500}
    # 可选：Sentinel 控制台；没启动也能保护，只是没有可视化面板。
    sentinel:
      transport:
        dashboard: ${SENTINEL_DASHBOARD:127.0.0.1:8858}
      eager: false

smart-fridge:
  sentinel:
    order-qps: ${ORDER_QPS:2}
    slow-call-millis: ${SLOW_CALL_MILLIS:500}
    slow-ratio: ${SLOW_RATIO:0.5}

# Seata AT：本服务是全局事务发起方（TM），库存服务是分支事务参与方（RM）。
# file 注册模式，地址直接给 seata-server。
seata:
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_GROUP:smart-fridge-tx-group}
  service:
    vgroup-mapping:
      smart-fridge-tx-group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,sentinel
  endpoint:
    health:
      probes:
        enabled: true
