spring:
  datasource:
    url: jdbc:h2:mem:smart_fridge_fridge;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

smart-fridge:
  auth-service-url: http://127.0.0.1:1

seata:
  enabled: false
