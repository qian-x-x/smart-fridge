server:
  port: 8082
spring:
  application:
    name: fridge-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:cloud}
  datasource:
    url: ${MYSQL_CORE_URL:jdbc:mysql://127.0.0.1:3306/fridge_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${MYSQL_CORE_USER:smart_fridge}
    password: ${MYSQL_CORE_PASSWORD:smart_fridge_dev}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:12}
      minimum-idle: 2
      connection-timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: ${FEIGN_CONNECT_TIMEOUT_MS:1000}
            read-timeout: ${FEIGN_READ_TIMEOUT_MS:3000}
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE

smart-fridge:
  auth-service-url: ${AUTH_SERVICE_URL:}
  fridge:
    # 本地兜底值；Nacos 上的 fridge-service.yaml 会覆盖它，用于演示外置配置与动态刷新。
    expiring-threshold-days: ${EXPIRING_THRESHOLD_DAYS:3}

seata:
  enable-auto-data-source-proxy: false
  enabled: ${SEATA_ENABLED:true}
  application-id: ${spring.application.name}
  tx-service-group: ${SEATA_TX_GROUP:smart-fridge-tx-group}
  service:
    vgroup-mapping:
      smart-fridge-tx-group: default
    grouplist:
      default: ${SEATA_ADDR:127.0.0.1:8091}
  registry:
    type: file
  config:
    type: file
  data-source-proxy-mode: AT

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
