server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:cloud}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
      config:
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
    gateway:
      routes:
        - id: auth-family
          uri: lb://auth-family-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/families/**
        - id: fridge
          uri: lb://fridge-service
          predicates:
            - Path=/api/v1/fridges/**,/api/v1/foods/**,/api/v1/operations/**
        - id: recipe
          uri: lb://recipe-service
          predicates:
            - Path=/api/v1/recipes/**
        - id: stock
          uri: lb://stock-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/replenishment/**
        - id: order
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
      globalcors:
        cors-configurations:
          '[/**]':
            # Patterns instead of a fixed origin list so the same build works
            # from 127.0.0.1, localhost and any LAN address a phone or another
            # laptop uses. Tighten this to explicit origins in production.
            allowed-origin-patterns:
              - ${ADMIN_ORIGIN:http://localhost:*}
              - ${FLUTTER_WEB_ORIGIN:http://127.0.0.1:*}
              - ${LAN_ORIGIN_PATTERN_A:http://192.168.*:*}
              - ${LAN_ORIGIN_PATTERN_B:http://10.*:*}
              - ${LAN_ORIGIN_PATTERN_C:http://172.*:*}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: ["*"]
            exposed-headers: [X-Request-Id]
            allow-credentials: true

smart-fridge:
  auth-service-url: ${AUTH_SERVICE_URL:http://127.0.0.1:8081}
  jwt:
    secret: ${JWT_SECRET:dev-only-smart-fridge-secret-change-before-release-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
