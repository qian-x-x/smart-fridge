server:
  port: 8080

spring:
  application:
    name: gateway-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
      config:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:}
        group: SMART_FRIDGE
    gateway:
      routes:
        - id: auth-family
          uri: lb://auth-family-service
          predicates:
            - Path=/api/v1/auth/**,/api/v1/families/**
        - id: fridge
          uri: lb://fridge-service
          predicates:
            - Path=/api/v1/fridges/**,/api/v1/foods/**,/api/v1/operations/**
        - id: recipe
          uri: lb://recipe-service
          predicates:
            - Path=/api/v1/recipes/**
        - id: stock
          uri: lb://stock-service
          predicates:
            - Path=/api/v1/products/**,/api/v1/replenishment/**
        - id: order
          uri: lb://order-service
          predicates:
            - Path=/api/v1/orders/**
        - id: notification
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/notifications/**,/api/v1/ws/**
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - ${ADMIN_ORIGIN:http://localhost:5173}
              - ${FLUTTER_WEB_ORIGIN:http://localhost:3000}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: ["*"]
            exposed-headers: [X-Request-Id]
            allow-credentials: true

smart-fridge:
  jwt:
    secret: ${JWT_SECRET:dev-only-smart-fridge-secret-change-before-release-2026}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      probes:
        enabled: true
