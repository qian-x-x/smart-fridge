spring:
  datasource:
    url: jdbc:h2:mem:smart_fridge_auth;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false

smart-fridge:
  jwt:
    secret: test-only-smart-fridge-secret-at-least-thirty-two-bytes
    access-token-ttl: 15m
    refresh-token-ttl: 7d
