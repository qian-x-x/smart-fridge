        oldZoneId:
          type: integer
          format: int64
          nullable: true
        oldContainerId:
          type: integer
          format: int64
          nullable: true
        oldQuantity:
          type: number
          nullable: true
        newZoneId:
          type: integer
          format: int64
          nullable: true
        newContainerId:
          type: integer
          format: int64
          nullable: true
        newQuantity:
          type: number
          nullable: true
        note:
          type: string
          nullable: true
        originalOperationId:
          type: integer
          format: int64
          nullable: true
        revertedByOperationId:
          type: integer
          format: int64
          nullable: true
        undone:
          type: boolean
        undoable:
          type: boolean
        createdAt:
          type: string
          format: date-time
    CookItemRequest:
      type: object
      required: [foodItemId, quantity]
      properties:
        foodItemId:
          type: integer
          format: int64
          minimum: 1
        quantity:
          type: number
          minimum: 0.001
        version:
          type: integer
          minimum: 0
          nullable: true
    CookRequest:
      type: object
      required: [recipeId, recipeName, servings, requestId, items]
      properties:
        recipeId:
          type: integer
          format: int64
          minimum: 1
        recipeName:
          type: string
          maxLength: 80
        servings:
          type: integer
          minimum: 1
          maximum: 20
        requestId:
          type: string
          minLength: 8
          maxLength: 64
          pattern: '^[A-Za-z0-9_-]+$'
        note:
          type: string
          maxLength: 200
          nullable: true
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CookItemRequest'
    CookItem:
      type: object
      properties:
        foodItemId:
          type: integer
          format: int64
        foodName:
          type: string
        quantity:
          type: number
        unit:
          type: string
    CookRecord:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fridgeId:
          type: integer
          format: int64
        recipeId:
          type: integer
          format: int64
        recipeName:
          type: string
        actorUserId:
          type: integer
          format: int64
        servings:
          type: integer
        note:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        items:
          type: array
          items:
            $ref: '#/components/schemas/CookItem'
    ExpiredCleanup:
      type: object
      properties:
        count:
          type: integer
          description: 实际丢弃的条数
        skipped:
          type: integer
          description: 扫描时已过期但被并发修改而跳过的条数
        foods:
          type: array
          description: 被丢弃的食材（丢弃前快照）
          items:
            $ref: '#/components/schemas/Food'
    ProductStock:
      type: object
      properties:
        sku:
          type: string
          example: APPLE
        name:
          type: string
          example: 云南小番茄
        stock:
          type: integer
          minimum: 0
    DeductStockRequest:
      type: object
      required: [quantity]
      properties:
        quantity:
          type: integer
          minimum: 1
    CreateOrderRequest:
      type: object
      required: [sku, quantity]
      properties:
        sku:
          type: string
          example: APPLE
        quantity:
          type: integer
          minimum: 1
        stockDelayMs:
          type: integer
          nullable: true
          description: 仅用于演示调用变慢与熔断，正常下单不传
        failAfterDeduct:
          type: boolean
          nullable: true
          description: 仅用于演示全局回滚：库存扣减成功后主动失败，验证订单与库存一起回滚。正常下单不传
    OrderRow:
      type: object
      properties:
        orderId:
          type: string
          example: ORD-20261108-1A2B3C4D
        sku:
          type: string
          example: APPLE
        quantity:
          type: integer
        status:
          type: string
          enum: [PENDING, CREATED]
        createdAt:
          type: string
          format: date-time
    Order:
      type: object
      properties:
        orderId:
          type: string
          example: ORD-20261107-0001
        sku:
          type: string
        quantity:
