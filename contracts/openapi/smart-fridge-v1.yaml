openapi: 3.0.3
info:
  title: Smart Fridge API
  version: 1.3.0
  description: |
    可视化冰箱客户端与运营后台的统一 API 契约。
    当前版本实现认证家庭、邀请码加入、成员治理、冰箱结构、食材 CRUD 和食材操作日志。
servers:
  - url: http://localhost:8080
    description: Local Gateway
tags:
  - name: Authentication
  - name: Family
  - name: Fridge
  - name: Food
  - name: Recipe
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: 注册账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 用户名或手机号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 轮换刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 新的访问与刷新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 撤销当前访问令牌与刷新会话
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/introspect:
    post:
      tags: [Authentication]
      summary: 校验访问令牌及撤销状态
      description: Gateway 也使用此接口检查撤销状态；认证服务不可用时受保护接口返回 503，不将服务故障当作登录失效。
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 当前有效的访问令牌声明
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: {type: string, example: OK}
                  message: {type: string}
                  data: {type: object}
                  traceId: {type: string}
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families:
    get:
      tags: [Family]
      summary: 查询当前用户加入的家庭
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 家庭列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Family]
      summary: 创建家庭并成为拥有者
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                  example: 小满的家
      responses:
        '201':
          description: 家庭已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families/{familyId}:
    get:
      tags: [Family]
      summary: 查询单个家庭
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '404':
          description: 家庭不存在或当前用户不是成员
  /api/v1/families/join:
    post:
      tags: [Family]
      summary: 通过邀请码加入家庭
      description: 已加入同一家庭时幂等返回当前成员角色。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFamilyRequest'
      responses:
        '200':
          description: 已加入家庭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/families/{familyId}/members:
    get:
      tags: [Family]
      summary: 查询家庭成员
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/families/{familyId}/members/{userId}:
    patch:
      tags: [Family]
      summary: 调整普通成员角色
      description: 仅家庭 OWNER 可调用；只接受 EDITOR 和 VIEWER。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFamilyRoleRequest'
      responses:
        '200':
          description: 更新后的成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Family]
      summary: 移除普通成员
      description: 仅家庭 OWNER 可调用，不能移除拥有者。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/transfer-owner:
    post:
      tags: [Family]
      summary: 转交家庭所有权
      description: 目标必须是 EDITOR；成功后原拥有者变为 EDITOR。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferFamilyOwnerRequest'
      responses:
        '200':
          description: 更新后的家庭和当前用户角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges:
    get:
      tags: [Fridge]
      summary: 按家庭查询冰箱
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭冰箱及分区结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Fridge]
      summary: 为家庭创建冰箱及默认四区结构
      description: 仅家庭 OWNER 可调用；每个家庭只能有一个冰箱。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFridgeRequest'
      responses:
        '201':
          description: 冰箱已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges/{fridgeId}:
    get:
      tags: [Fridge]
      summary: 查询冰箱结构
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
      responses:
        '200':
          description: 冰箱及分区、容器结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/foods:
    get:
      tags: [Food]
      summary: 查询冰箱中的有效食材
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeIdQuery'
        - name: query
          in: query
          required: false
          description: 名称不区分大小写的字面包含搜索，百分号和下划线不作为通配符。所有筛选条件同时满足。
          schema:
            type: string
            maxLength: 80
        - name: category
          in: query
          description: 完整分类名称
          schema: {type: string, maxLength: 40}
        - name: tags
          in: query
          style: form
          explode: true
          description: 重复传递 tags 参数，需同时包含所有完整标签；标签不能含逗号。
          schema:
            type: array
            maxItems: 20
            items: {type: string, minLength: 1, maxLength: 40, pattern: '^[^,]*$'}
        - name: zoneId
          in: query
          description: 当前冰箱中的分区 ID，其他冰箱分区不会返回结果
          schema: {type: integer, format: int64, minimum: 1}
        - name: expiryState
          in: query
          description: 依据冰箱时区，EXPIRED 为今天之前，EXPIRING 为今天到三天后（含边界），FRESH 为三天后以外。
          schema: {type: string, enum: [ALL, EXPIRED, EXPIRING, FRESH], default: ALL}
        - name: expiresFrom
          in: query
          description: 到期起日，含当天，不能晚于 expiresTo
          schema: {type: string, format: date}
        - name: expiresTo
          in: query
          description: 到期止日，含当天
          schema: {type: string, format: date}
        - name: sort
          in: query
          description: 排序字段白名单；主字段相同时按 ID 升序，保证结果稳定
          schema: {type: string, enum: [EXPIRES_ASC, EXPIRES_DESC, NAME_ASC, CREATED_DESC], default: EXPIRES_ASC}
      responses:
        '200':
          description: 食材列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Food'
                  traceId:
                    type: string
        '400':
          description: 筛选参数无效、日期范围颠倒或排序不在白名单内
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Food]
      summary: 添加食材或调料
      description: OWNER 和 EDITOR 可调用；操作会原样写入时间线。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodRequest'
      responses:
        '201':
          description: 食材已添加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/foods/{foodId}:
    get:
      tags: [Food]
      summary: 查询食材详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      responses:
        '200':
          description: 食材详情与临期状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Food]
      summary: 编辑食材详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodRequest'
      responses:
        '200':
          description: 更新后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Food]
      summary: 丢弃食材并写入操作日志
      description: 使用软删除，不物理删除食材或历史记录。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '204':
          description: 食材已丢弃
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/foods/{foodId}/move:
    post:
      tags: [Food]
      summary: 移动食材到其他分区或容器
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFoodRequest'
      responses:
        '200':
          description: 移动后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/foods/{foodId}/consume:
    post:
      tags: [Food]
      summary: 使用食材并扣减数量
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeFoodRequest'
      responses:
        '200':
          description: 扣减后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges/{fridgeId}/discard-expired:
    post:
      tags: [Food]
      summary: 一键清理已过期食材
      description: 服务端按冰箱时区判定过期（到期日早于今天），逐条软删除并写入 DISCARD 流水，备注为「过期清理」。今天到期的食材不会被清理。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
      responses:
        '200':
          description: 清理结果，包含实际丢弃的数据与被并发修改而跳过的条数
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ExpiredCleanup'
                  traceId:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/fridges/{fridgeId}/operations:
    get:
      tags: [Operation]
      summary: 查询冰箱操作时间线
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
        - name: foodId
          in: query
          description: 只返回指定食材的操作记录
          schema: {type: integer, format: int64, minimum: 1}
        - name: limit
          in: query
          description: 返回条数，默认 30，最大 100
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        '200':
          description: 按创建时间倒序的操作记录，标记是否可撤销
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FoodOperation'
                  traceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/foods/{foodId}/operations/{operationId}/undo:
    post:
      tags: [Operation]
      summary: 撤销一条食材操作
      description: 只有移动、使用、做饭扣减和丢弃可撤销；同一操作重复撤销或恢复未撤销的操作返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
        - $ref: '#/components/parameters/OperationId'
        - name: version
          in: query
          required: false
          description: 客户端持有的食材版本；传入且不一致时返回 409
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: 撤销后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/foods/{foodId}/operations/{operationId}/restore:
    post:
      tags: [Operation]
      summary: 恢复一条已撤销的食材操作
      description: 重新应用该操作的新值；数量不足或食材已不在启用状态时返回 409。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
        - $ref: '#/components/parameters/OperationId'
        - name: version
          in: query
          required: false
          description: 客户端持有的食材版本；传入且不一致时返回 409
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: 恢复后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges/{fridgeId}/cook-records:
    get:
      tags: [Cooking]
      summary: 查询做饭记录
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
        - name: limit
          in: query
          description: 返回条数，默认 20，最大 50
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
      responses:
        '200':
          description: 按创建时间倒序的做饭记录
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/CookRecord'
                  traceId:
                    type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Cooking]
      summary: 确认做饭并按清单扣减食材
      description: requestId 在同一次做饭重试时保证幂等：重复请求返回 200 与既有记录，不再扣减。任一食材库存不足时整批回滚。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CookRequest'
      responses:
        '201':
          description: 新建的做饭记录
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CookRecord'
                  traceId:
                    type: string
        '200':
          description: 幂等重放命中既有记录，未重复扣减
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/CookRecord'
                  traceId:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/products/{sku}:
    get:
      tags: [Product]
      summary: 查询商品库存
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Sku'
        - name: delayMs
          in: query
          required: false
          description: 仅用于故障注入演示，让接口延迟响应；生产调用不应传
          schema: {type: integer, minimum: 0, maximum: 10000}
      responses:
        '200':
          description: 库存快照
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProductStock'
                  traceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/products/{sku}/deduct:
    post:
      tags: [Product]
      summary: 扣减库存
      description: 库存不足返回 409；扣减使用原子更新，并发下不会扣成负数。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Sku'
        - name: delayMs
          in: query
          required: false
          description: 仅用于故障注入演示
          schema: {type: integer, minimum: 0, maximum: 10000}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeductStockRequest'
      responses:
        '200':
          description: 扣减后的库存
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/ProductStock'
                  traceId:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/orders:
    get:
      tags: [Order]
      summary: 查询最近订单
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: 返回条数，默认 20，最大 100
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
      responses:
        '200':
          description: 按创建时间倒序的订单
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/OrderRow'
                  traceId:
                    type: string
    post:
      tags: [Order]
      summary: 下单并扣减库存
      description: 通过服务名调用库存服务扣减。三种结果：201 创建成功、429 被 Sentinel 流控拦截、503 库存服务不可用或被熔断。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrderRequest'
      responses:
        '201':
          description: 订单已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Order'
                  traceId:
                    type: string
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          description: 被流控规则拦截（QPS 上限 2）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 库存服务不可用或熔断打开
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 订单落库后主动失败触发全局回滚；只有演示参数 failAfterDeduct 会走到这里，回滚后订单与库存都不留下
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /api/v1/orders/{orderId}:
    get:
      tags: [Order]
      summary: 查询单笔订单
      description: 全局回滚后该订单查不到（404），用于验证回滚确实撤销了已写入的订单行。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: 订单详情
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/OrderRow'
                  traceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/recipes:
    get:
      tags: [Recipe]
      summary: 查询菜谱目录
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 按精选和菜谱 ID 排序的菜谱列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
                  traceId:
                    type: string
  /api/v1/recipes/{recipeId}:
    get:
      tags: [Recipe]
      summary: 查询菜谱详情
      security:
        - bearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 菜谱、原料和步骤
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Recipe'
                  traceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    FridgeId:
      name: fridgeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FridgeIdQuery:
      name: fridgeId
      in: query
      required: true
      schema:
        type: integer
        format: int64
    FoodId:
      name: foodId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    OperationId:
      name: operationId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Sku:
      name: sku
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9_-]{1,32}$'

    OrderId:
      name: orderId
      in: path
      required: true
      schema:
        type: string
        pattern: '^ORD-[0-9]{8}-[A-Z0-9]{8}$'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    ServiceUnavailable:
      description: 认证或依赖服务暂时不可用，客户端可重试且不应清除登录会话
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: 未登录、令牌无效或已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突、版本过期或业务约束不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 当前家庭成员无权执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 请求字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或当前用户无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [displayName, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-zA-Z0-9_]+$'
        phone:
          type: string
          nullable: true
          pattern: '^1[3-9][0-9]{9}$'
        displayName:
          type: string
          maxLength: 40
        password:
          type: string
          minLength: 8
          maxLength: 72
          description: UTF-8 编码后最多 72 字节
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: 用户名或手机号
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: 访问令牌有效秒数
        user:
          $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthTokens'
        traceId:
          type: string
    Family:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inviteCode:
          type: string
        ownerUserId:
          type: integer
          format: int64
        currentUserRole:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
        createdAt:
          type: string
          format: date-time
    JoinFamilyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[A-Za-z0-9]{8}$'
          example: ABCD2345
    UpdateFamilyRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          example: EDITOR
    TransferFamilyOwnerRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer
          format: int64
    FamilyMember:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        displayName:
          type: string
        role:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
        joinedAt:
          type: string
          format: date-time
        currentUser:
          type: boolean
    FamilyResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Family'
        traceId:
          type: string
    FamilyMemberResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyMember'
        traceId:
          type: string
    FamilyMemberListResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
        traceId:
          type: string
    CreateFridgeRequest:
      type: object
      required: [familyId, name]
      properties:
        familyId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 80
    FridgeContainer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [SHELF, DRAWER, BASKET]
        sortOrder:
          type: integer
    FridgeZone:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          enum: [FRESH, VARIABLE, FREEZER, PANTRY]
        name:
          type: string
        temperatureC:
          type: number
          format: double
          nullable: true
        sortOrder:
          type: integer
        containers:
          type: array
          items:
            $ref: '#/components/schemas/FridgeContainer'
    Fridge:
      type: object
      properties:
        id:
          type: integer
          format: int64
        familyId:
          type: integer
          format: int64
        name:
          type: string
        timezone:
          type: string
          example: Asia/Shanghai
        zones:
          type: array
          items:
            $ref: '#/components/schemas/FridgeZone'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FridgeResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Fridge'
        traceId:
          type: string
    Food:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fridgeId:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string
        productionDate:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        remainingDays:
          type: integer
          format: int64
        expiring:
          type: boolean
        tags:
          type: array
          items:
            type: string
        modelKey:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        createdBy:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int64
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FoodResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Food'
        traceId:
          type: string
    CreateFoodRequest:
      type: object
      required:
        - fridgeId
        - zoneId
        - name
        - category
        - quantity
        - unit
        - productionDate
        - expiresOn
      properties:
        fridgeId:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          maxLength: 80
        category:
          type: string
          maxLength: 40
        quantity:
          type: number
          format: double
          minimum: 0.001
          maximum: 999999999.999
          multipleOf: 0.001
        unit:
          type: string
          maxLength: 20
        productionDate:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        tags:
          type: array
          maxItems: 20
          description: 去空格及去重后以逗号连接的总长度不能超过 500 字符
          items:
            type: string
            minLength: 1
            maxLength: 30
            pattern: '^[^,]+$'
        modelKey:
          type: string
          maxLength: 80
        photoUrl:
          type: string
          maxLength: 500
    UpdateFoodRequest:
      type: object
      required:
        - zoneId
        - name
        - category
        - quantity
        - unit
        - productionDate
        - expiresOn
        - version
      properties:
        zoneId:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
          maxLength: 80
        category:
          type: string
          maxLength: 40
        quantity:
          type: number
          format: double
          minimum: 0.001
          maximum: 999999999.999
          multipleOf: 0.001
        unit:
          type: string
          maxLength: 20
        productionDate:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        tags:
          type: array
          maxItems: 20
          description: 去空格及去重后以逗号连接的总长度不能超过 500 字符
          items:
            type: string
            minLength: 1
            maxLength: 30
            pattern: '^[^,]+$'
        modelKey:
          type: string
          maxLength: 80
        photoUrl:
          type: string
          maxLength: 500
        version:
          type: integer
          minimum: 0
    MoveFoodRequest:
      type: object
      required: [zoneId, version]
      properties:
        zoneId:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
          nullable: true
        version:
          type: integer
          minimum: 0
    ConsumeFoodRequest:
      type: object
      required: [quantity, version]
      properties:
        quantity:
          type: number
          format: double
          minimum: 0.001
          maximum: 999999999.999
          multipleOf: 0.001
        version:
          type: integer
          minimum: 0
    RecipeIngredient:
      type: object
      properties:
        name:
          type: string
        quantity:
          type: number
          nullable: true
        unit:
          type: string
          nullable: true
        optional:
          type: boolean
    Recipe:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        summary:
          type: string
        category:
          type: string
        durationMinutes:
          type: integer
        calories:
          type: integer
        difficulty:
          type: string
        servings:
          type: integer
        coverEmoji:
          type: string
        steps:
          type: array
          items:
            type: string
        ingredients:
          type: array
          items:
            $ref: '#/components/schemas/RecipeIngredient'
        featured:
          type: boolean
    FoodOperation:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fridgeId:
          type: integer
          format: int64
        foodItemId:
          type: integer
          format: int64
        foodName:
          type: string
        actorUserId:
          type: integer
          format: int64
        action:
          type: string
