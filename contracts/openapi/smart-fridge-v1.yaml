openapi: 3.0.3
info:
  title: Smart Fridge API
  version: 1.0.0
  description: |
    可视化冰箱客户端与运营后台的统一 API 契约。
    当前版本实现认证、家庭查询和所有服务的健康骨架。
servers:
  - url: http://localhost:8080
    description: Local Gateway
tags:
  - name: Authentication
  - name: Family
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: 注册账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 用户名或手机号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 轮换刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 新的访问与刷新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 撤销当前访问令牌与刷新会话
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families:
    get:
      tags: [Family]
      summary: 查询当前用户加入的家庭
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 家庭列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Family]
      summary: 创建家庭并成为拥有者
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                  example: 小满的家
      responses:
        '201':
          description: 家庭已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families/{familyId}:
    get:
      tags: [Family]
      summary: 查询单个家庭
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '404':
          description: 家庭不存在或当前用户不是成员
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录、令牌无效或已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 用户名或手机号冲突
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [displayName, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-zA-Z0-9_]+$'
        phone:
          type: string
          nullable: true
          pattern: '^1[3-9][0-9]{9}$'
        displayName:
          type: string
          maxLength: 40
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: 用户名或手机号
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: 访问令牌有效秒数
        user:
          $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthTokens'
        traceId:
          type: string
    Family:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inviteCode:
          type: string
        ownerUserId:
          type: integer
          format: int64
        currentUserRole:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
        createdAt:
          type: string
          format: date-time
    SimpleResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: UNAUTHORIZED
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
