openapi: 3.0.3
info:
  title: Smart Fridge API
  version: 1.3.0
  description: |
    可视化冰箱客户端与运营后台的统一 API 契约。
    当前版本实现认证家庭、邀请码加入、成员治理、冰箱结构、食材 CRUD 和食材操作日志。
servers:
  - url: http://localhost:8080
    description: Local Gateway
tags:
  - name: Authentication
  - name: Family
  - name: Fridge
  - name: Food
  - name: Recipe
paths:
  /api/v1/auth/register:
    post:
      tags: [Authentication]
      summary: 注册账号
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: 注册成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: 用户名或手机号登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: 轮换刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 新的访问与刷新令牌
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: 撤销当前访问令牌与刷新会话
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
      responses:
        '200':
          description: 已退出
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimpleResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families:
    get:
      tags: [Family]
      summary: 查询当前用户加入的家庭
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 家庭列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Family]
      summary: 创建家庭并成为拥有者
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                  maxLength: 60
                  example: 小满的家
      responses:
        '201':
          description: 家庭已创建
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/families/{familyId}:
    get:
      tags: [Family]
      summary: 查询单个家庭
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭信息
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  data:
                    $ref: '#/components/schemas/Family'
                  traceId:
                    type: string
        '404':
          description: 家庭不存在或当前用户不是成员
  /api/v1/families/join:
    post:
      tags: [Family]
      summary: 通过邀请码加入家庭
      description: 已加入同一家庭时幂等返回当前成员角色。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JoinFamilyRequest'
      responses:
        '200':
          description: 已加入家庭
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/families/{familyId}/members:
    get:
      tags: [Family]
      summary: 查询家庭成员
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭成员列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMemberListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/families/{familyId}/members/{userId}:
    patch:
      tags: [Family]
      summary: 调整普通成员角色
      description: 仅家庭 OWNER 可调用；只接受 EDITOR 和 VIEWER。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFamilyRoleRequest'
      responses:
        '200':
          description: 更新后的成员
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyMemberResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Family]
      summary: 移除普通成员
      description: 仅家庭 OWNER 可调用，不能移除拥有者。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: userId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: 成员已移除
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/families/{familyId}/transfer-owner:
    post:
      tags: [Family]
      summary: 转交家庭所有权
      description: 目标必须是 EDITOR；成功后原拥有者变为 EDITOR。
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferFamilyOwnerRequest'
      responses:
        '200':
          description: 更新后的家庭和当前用户角色
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FamilyResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges:
    get:
      tags: [Fridge]
      summary: 按家庭查询冰箱
      security:
        - bearerAuth: []
      parameters:
        - name: familyId
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 家庭冰箱及分区结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Fridge]
      summary: 为家庭创建冰箱及默认四区结构
      description: 仅家庭 OWNER 可调用；每个家庭只能有一个冰箱。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFridgeRequest'
      responses:
        '201':
          description: 冰箱已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/fridges/{fridgeId}:
    get:
      tags: [Fridge]
      summary: 查询冰箱结构
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeId'
      responses:
        '200':
          description: 冰箱及分区、容器结构
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FridgeResponse'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/foods:
    get:
      tags: [Food]
      summary: 查询冰箱中的有效食材
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FridgeIdQuery'
        - name: query
          in: query
          required: false
          description: 按食材名称进行不区分大小写的包含搜索
          schema:
            type: string
      responses:
        '200':
          description: 食材列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Food'
                  traceId:
                    type: string
    post:
      tags: [Food]
      summary: 添加食材或调料
      description: OWNER 和 EDITOR 可调用；操作会原样写入时间线。
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFoodRequest'
      responses:
        '201':
          description: 食材已添加
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/foods/{foodId}:
    get:
      tags: [Food]
      summary: 查询食材详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      responses:
        '200':
          description: 食材详情与临期状态
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Food]
      summary: 编辑食材详情
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateFoodRequest'
      responses:
        '200':
          description: 更新后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [Food]
      summary: 丢弃食材并写入操作日志
      description: 使用软删除，不物理删除食材或历史记录。
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
        - name: version
          in: query
          required: true
          schema:
            type: integer
            minimum: 0
      responses:
        '204':
          description: 食材已丢弃
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/foods/{foodId}/move:
    post:
      tags: [Food]
      summary: 移动食材到其他分区或容器
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveFoodRequest'
      responses:
        '200':
          description: 移动后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/foods/{foodId}/consume:
    post:
      tags: [Food]
      summary: 使用食材并扣减数量
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FoodId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsumeFoodRequest'
      responses:
        '200':
          description: 扣减后的食材
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FoodResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/recipes:
    get:
      tags: [Recipe]
      summary: 查询菜谱目录
      security:
        - bearerAuth: []
      responses:
        '200':
          description: 按精选和菜谱 ID 排序的菜谱列表
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    example: OK
                  message:
                    type: string
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Recipe'
                  traceId:
                    type: string
  /api/v1/recipes/{recipeId}:
    get:
      tags: [Recipe]
      summary: 查询菜谱详情
      security:
        - bearerAuth: []
      parameters:
        - name: recipeId
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: 菜谱、原料和步骤
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  data:
                    $ref: '#/components/schemas/Recipe'
                  traceId:
                    type: string
        '404':
          $ref: '#/components/responses/NotFound'
components:
  parameters:
    FridgeId:
      name: fridgeId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    FridgeIdQuery:
      name: fridgeId
      in: query
      required: true
      schema:
        type: integer
        format: int64
    FoodId:
      name: foodId
      in: path
      required: true
      schema:
        type: integer
        format: int64
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    Unauthorized:
      description: 未登录、令牌无效或已撤销
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 资源冲突、版本过期或业务约束不满足
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 当前家庭成员无权执行该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: 请求字段校验失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: 资源不存在或当前用户无权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    RegisterRequest:
      type: object
      required: [displayName, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 40
          pattern: '^[a-zA-Z0-9_]+$'
        phone:
          type: string
          nullable: true
          pattern: '^1[3-9][0-9]{9}$'
        displayName:
          type: string
          maxLength: 40
        password:
          type: string
          minLength: 8
          maxLength: 72
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier:
          type: string
          description: 用户名或手机号
        password:
          type: string
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        displayName:
          type: string
        role:
          type: string
          enum: [USER, ADMIN]
    AuthTokens:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: integer
          description: 访问令牌有效秒数
        user:
          $ref: '#/components/schemas/User'
    AuthResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
          example: success
        data:
          $ref: '#/components/schemas/AuthTokens'
        traceId:
          type: string
    Family:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        inviteCode:
          type: string
        ownerUserId:
          type: integer
          format: int64
        currentUserRole:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
        createdAt:
          type: string
          format: date-time
    JoinFamilyRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
          minLength: 8
          maxLength: 8
          pattern: '^[A-Za-z0-9]{8}$'
          example: ABCD2345
    UpdateFamilyRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          example: EDITOR
    TransferFamilyOwnerRequest:
      type: object
      required: [targetUserId]
      properties:
        targetUserId:
          type: integer
          format: int64
    FamilyMember:
      type: object
      properties:
        userId:
          type: integer
          format: int64
        username:
          type: string
          nullable: true
        displayName:
          type: string
        role:
          type: string
          enum: [OWNER, EDITOR, VIEWER]
        joinedAt:
          type: string
          format: date-time
        currentUser:
          type: boolean
    FamilyResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Family'
        traceId:
          type: string
    FamilyMemberResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/FamilyMember'
        traceId:
          type: string
    FamilyMemberListResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          type: array
          items:
            $ref: '#/components/schemas/FamilyMember'
        traceId:
          type: string
    CreateFridgeRequest:
      type: object
      required: [familyId, name]
      properties:
        familyId:
          type: integer
          format: int64
        name:
          type: string
          maxLength: 80
    FridgeContainer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          enum: [SHELF, DRAWER, BASKET]
        sortOrder:
          type: integer
    FridgeZone:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          enum: [FRESH, VARIABLE, FREEZER, PANTRY]
        name:
          type: string
        temperatureC:
          type: number
          format: double
          nullable: true
        sortOrder:
          type: integer
        containers:
          type: array
          items:
            $ref: '#/components/schemas/FridgeContainer'
    Fridge:
      type: object
      properties:
        id:
          type: integer
          format: int64
        familyId:
          type: integer
          format: int64
        name:
          type: string
        timezone:
          type: string
          example: Asia/Shanghai
        zones:
          type: array
          items:
            $ref: '#/components/schemas/FridgeZone'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FridgeResponse:
      type: object
      properties:
        code:
          type: string
          example: OK
        message:
          type: string
        data:
          $ref: '#/components/schemas/Fridge'
        traceId:
          type: string
    Food:
      type: object
      properties:
        id:
          type: integer
          format: int64
        fridgeId:
          type: integer
          format: int64
        zoneId:
          type: integer
          format: int64
        containerId:
          type: integer
          format: int64
          nullable: true
        name:
          type: string
        category:
          type: string
        quantity:
          type: number
          format: double
        unit:
          type: string
        productionDate:
          type: string
          format: date
        expiresOn:
          type: string
          format: date
        remainingDays:
          type: integer
          format: int64
        expiring:
          type: boolean
        tags:
          type: array
          items:
            type: string
        modelKey:
          type: string
          nullable: true
        photoUrl:
          type: string
          nullable: true
        createdBy:
          type: integer
          format: int64
        updatedBy:
          type: integer
          format: int64
        version:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    FoodResponse:
