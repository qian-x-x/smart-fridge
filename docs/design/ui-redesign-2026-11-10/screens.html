<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>小易冰箱 · 逐页审查</title><link rel="stylesheet" href="review.css"><style>.shots{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:28px;padding:30px 0}.shot{min-width:0}.shot h2{font-size:16px;margin-bottom:10px}.shot img{max-width:100%;height:auto;border:1px solid #cbd4db;background:white;border-radius:8px}.shot.phone img{max-width:390px;display:block;margin:auto}.shot p{font-size:12px;color:#59636d;margin-top:8px}@media(max-width:760px){.shots{grid-template-columns:1fr}}</style></head><body class="gallery"><header class="review-header"><a class="wordmark" href="index.html">← 三套方案</a><span class="status" id="title"></span></header><main><div class="shots" id="shots"></div></main><script>const q=new URLSearchParams(location.search);const s=['a','b','c'].includes(q.get('scheme'))?q.get('scheme'):'a';document.getElementById('title').textContent=s.toUpperCase()+' · 逐页高清审查 · 演示数据';document.getElementById('shots').innerHTML=[['home','桌面首页'],['mobile','手机首页','phone'],['foods','食材清单与筛选'],['mobile-foods','手机清单','phone'],['add','新增食材','phone'],['detail','食材详情','phone'],['recipes','菜谱灵感'],['family','家庭与权限'],['login','登录'],['records','操作时间线'],['components','按钮状态']].map(([file,title,cls])=>`<section class="shot ${cls||''}"><h2>${title}</h2><a href="screens/${s}/${file}.png"><img src="screens/${s}/${file}.png" alt="${title}" loading="lazy"></a><p><a href="prototype.html?scheme=${s}&page=${file==='mobile'||file==='add'||file==='detail'?'home':file==='mobile-foods'?'foods':file}">进入可点击样稿 →</a></p></section>`).join('');</script></body></html>
