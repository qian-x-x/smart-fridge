# Serves the Flutter web build and proxies /api to the gateway on the same
# origin, so the browser never needs a cross-origin call to port 8080. This is
# what makes the app usable from a phone on the same Wi-Fi without CORS setup.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/wasm;

    location /api/ {
        proxy_pass http://sf-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
