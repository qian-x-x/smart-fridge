name: smart-fridge-core

services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: smart-fridge-nacos
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    volumes:
      - nacos-data:/home/nacos/data
      - nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [smart-fridge]

  mysql-core:
    image: mysql:8.0.39
    container_name: smart-fridge-mysql-core
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smart_fridge_root_dev}
      MYSQL_DATABASE: auth_db
      MYSQL_USER: ${MYSQL_CORE_USER:-smart_fridge}
      MYSQL_PASSWORD: ${MYSQL_CORE_PASSWORD:-smart_fridge_dev}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql-core-data:/var/lib/mysql
      - ../mysql/core:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [smart-fridge]

  mysql-trade:
    image: mysql:8.0.39
    container_name: smart-fridge-mysql-trade
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-smart_fridge_root_dev}
      MYSQL_DATABASE: stock_db
      MYSQL_USER: ${MYSQL_TRADE_USER:-smart_fridge_trade}
      MYSQL_PASSWORD: ${MYSQL_TRADE_PASSWORD:-smart_fridge_trade_dev}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-trade-data:/var/lib/mysql
      - ../mysql/trade:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [smart-fridge]

  redis:
    image: redis:7.2.5-alpine
    container_name: smart-fridge-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:-smart_fridge_dev}
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD:-smart_fridge_dev} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks: [smart-fridge]

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: smart-fridge-minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smart_fridge}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smart_fridge_dev}
      MINIO_DEFAULT_BUCKETS: fridge-stickers:download,fridge-photos,recipe-covers:download
      MINIO_API_PORT_NUMBER: "9000"
      MINIO_CONSOLE_PORT_NUMBER: "9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [smart-fridge]

volumes:
  nacos-data:
  nacos-logs:
  mysql-core-data:
  mysql-trade-data:
  redis-data:
  minio-data:

networks:
  smart-fridge:
    name: smart-fridge
