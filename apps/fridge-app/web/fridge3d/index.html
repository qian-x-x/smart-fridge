<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf5e9">
  <title>小易冰箱 · 暖橙厨房</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #scene { width:100%; height:100%; margin:0; overflow:hidden; background:#fcf5e9; }
    body { font:12px "Microsoft YaHei UI", "PingFang SC", sans-serif; color:#442b22; }
    #fridge-canvas { display:block; width:100%; height:100%; cursor:grab; touch-action:none; outline:none; }
    #fridge-canvas:focus-visible { outline:2px solid #bc4d30; outline-offset:-3px; }
    .controls { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); display:flex; gap:4px; padding:4px; max-width:calc(100% - 20px); background:rgba(255,255,255,.94); border:1px solid #ecdfcf; border-radius:22px; box-shadow:0 4px 20px #172f1b14; }
    button { appearance:none; border:0; border-radius:18px; background:transparent; color:#442b22; font:inherit; min-height:36px; padding:6px 10px; cursor:pointer; white-space:nowrap; }
    button { transition:background 160ms,transform 120ms; } button:active { transform:scale(.96); } button:hover { background:#f6e6d5; } button:focus-visible { outline:2px solid #bc4d30; }
    button[aria-pressed="true"] { background:#bc4d30; color:#fff; }
    .loading { position:absolute; inset:0; display:grid; place-content:center; background:#fcf5e9; color:#806a5c; }
    .is-hidden { display:none; }
    .fallback { position:absolute; inset:0; display:none; place-content:center; padding:24px; background:#fcf5e9; text-align:center; z-index:2; }
    .fallback.is-visible { display:grid; } .fallback strong { font-size:18px; margin-bottom:10px; } .fallback span { max-width:300px; line-height:1.7; }
    .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; }
    @media(max-width:480px) { .controls { gap:1px; bottom:8px; } button { padding:7px 7px; min-height:40px; font-size:11px; } }
  @media(prefers-reduced-motion:reduce) { button { transition:none; } }
  </style>
</head>
<body>
  <main id="scene" aria-label="写实厨房中的不锈钢冰箱三维场景">
    <canvas id="fridge-canvas" tabindex="0" aria-label="可交互冰箱。拖动查看；数字1到4选择分区，0恢复概览，Escape关闭冰箱。"></canvas>
    <div class="controls" role="group" aria-label="冰箱结构控制">
      <button id="overview" type="button">展开概览</button>
      <button id="left-door" type="button" data-part="leftDoor" aria-pressed="false">左门</button>
      <button id="right-door" type="button" data-part="rightDoor" aria-pressed="false">右门</button>
      <button id="variable-drawer" type="button" data-part="middleDrawer" aria-pressed="false">变温</button>
      <button id="freezer-drawer" type="button" data-part="freezerDrawer" aria-pressed="false">冷冻</button>
      <button id="close-all" type="button">全部关闭</button>
    </div>
    <div id="fallback" class="fallback" role="status"><strong>三维厨房暂不可用</strong><span>请打开浏览器硬件加速或重新加载。食材仍可通过页面的冰箱清单查看和管理。</span></div>
    <div id="loading" class="loading" role="status">正在打开厨房场景…</div>
    <output id="live-status" class="sr-only" aria-live="polite"></output>
  </main>
  <script>
    const showLoadError = () => { document.querySelector('#loading').classList.add('is-hidden'); document.querySelector('#fallback').classList.add('is-visible'); };
    window.addEventListener('error', showLoadError);
    window.addEventListener('unhandledrejection', showLoadError);
  </script>
  <script type="importmap">{"imports":{"three":"../vendor/three.module.min.js"}}</script>
  <script type="module" src="./fridge3d.js?rev=warm-harvest-v1.5.1"></script>
</body>
</html>
