<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="小易冰箱">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="小易冰箱">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>

  <meta name="theme-color" content="#171A1D">
  <title>小易冰箱</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #web-startup {
      position: fixed;
      inset: 0;
      z-index: 1;
      display: grid;
      place-content: center;
      justify-items: center;
      gap: 12px;
      padding: 24px;
      background: #f4f6f7;
      color: #171a1d;
      font: 1rem/1.5 system-ui, sans-serif;
      text-align: center;
    }
    #web-startup p { margin: 0; }
    #web-startup-retry {
      min-height: 44px;
      padding: 8px 16px;
      border: 0;
      border-radius: 12px;
      background: #171a1d;
      color: #fff;
      font: inherit;
    }
  </style>
</head>
<body>
  <main id="web-startup">
    <p id="web-startup-status" role="status">正在打开小易冰箱…</p>
    <button id="web-startup-retry" type="button" hidden>重新加载</button>
    <noscript><p>请在浏览器中启用 JavaScript。</p></noscript>
  </main>
  <script>
    // Keep startup feedback available even if the Flutter loader cannot run.
    (function () {
      var startup = document.getElementById('web-startup');
      var status = document.getElementById('web-startup-status');
      var retry = document.getElementById('web-startup-retry');
      function showStatus(message) {
        status.textContent = message;
        retry.hidden = false;
      }
      var timer = window.setTimeout(function () {
        showStatus('加载时间较长，请稍候。');
      }, 15000);
      function showError() {
        window.clearTimeout(timer);
        showStatus('页面加载失败。');
      }
      retry.addEventListener('click', function () { window.location.reload(); });
      window.addEventListener('xiaoyi-startup-error', showError, { once: true });
      window.addEventListener('flutter-first-frame', function () {
        window.clearTimeout(timer);
        window.removeEventListener('xiaoyi-startup-error', showError);
        startup.remove();
      }, { once: true });
    })();
  </script>
  <script>{{flutter_bootstrap_js}}</script>
</body>
</html>
